<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#0f8a8a" />
<title>Play the Hunt · Golden Gelato Goblet</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:linear-gradient(160deg,#0f8a8a 0%,#0a5f66 100%);min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:24px;color:#fff}
  .card{background:#fffaf0;color:#3d3020;border-radius:20px;max-width:420px;width:100%;
    padding:36px 26px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.35)}
  .big{font-size:58px;line-height:1;margin-bottom:10px}
  h1{font-size:22px;margin-bottom:6px;color:#0f8a8a}
  p{font-size:14px;color:#7a6a4f;margin-bottom:18px}
  .btn{display:inline-block;background:#0f8a8a;color:#fff;text-decoration:none;
    font-weight:800;font-size:17px;padding:14px 26px;border-radius:12px}
  .tiny{font-size:12px;color:#a3947a;margin-top:14px;margin-bottom:0}
</style>
</head>
<body>
  <div class="card">
    <div class="big">🐱🍦</div>
    <h1>Golden Gelato Goblet</h1>
    <p>Entering the hunt… if nothing happens, tap the button.</p>
    <a class="btn" href="game.html?mode=play">▶️ Enter the game</a>
    <p class="tiny">Players only — pick your guild when you get there.</p>
  </div>
  <script>location.replace('game.html?mode=play');</script>
</body>
</html>
