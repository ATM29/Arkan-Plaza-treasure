    cursor:pointer;text-align:center;text-decoration:none;margin-top:10px}

  .btn.gold{background:var(--gold);color:#3a2c00}
  .btn.ghost{background:#fff;color:var(--teal-dark);border:2px solid var(--teal)}
  .btn.danger{background:#fff;color:var(--red);border:2px solid var(--red)}

  .row{display:flex;gap:8px}.row .btn{margin-top:0}
  .msg{border-radius:10px;padding:10px 12px;margin-top:10px;font-weight:700;font-size:14px;display:none}

  .msg.err{background:#fdeef2;border:1px solid var(--red);color:#a5281b}

  .wrong-shake{animation:shake .4s}

</style>

/* ============ DATA ============ */
async function loadAll(){
  const [t,p,pr,m,e,s,f,pl]=await Promise.all([
    c.from('teams').select('*').order('name'),
    c.from('players').select('*'),
    c.from('stops_progress').select('*'),
    c.from('game_meta').select('*'),
    c.from('score_events').select('*'),
    c.from('settings').select('*'),
    c.from('finishes').select('*').order('finish_order'),
    c.from('teams').select('id').limit(1)
  ]);
  const errs=[];
  if(t.error)errs.push('teams: '+t.error.message);
  if(pr.error)errs.push('progress: '+pr.error.message);
  if(m.error)errs.push('meta: '+m.error.message);
  if(e.error)errs.push('events: '+e.error.message);
  if(s.error)errs.push('settings: '+s.error.message);
  if(f.error)errs.push('finishes: '+f.error.message);
  if(errs.length){showMsg('Could not load: '+errs.join(' · '),'err');return;}
  S.teams=t.data||[];S.players=p.data||[];S.progress=pr.data||[];S.meta=(m.data||[]).find(x=>x.team_id===S.team)||null;
  S.events=e.data||[];S.settings={};(s.data||[]).forEach(r=>S.settings[r.key]=r.value);
  S.finishes=f.data||[];
  S._loaded=true;
  if(S.team&&!S.meta){await ensureMeta();}
  const sig=JSON.stringify([S.progress,S.events,S.settings,S.finishes,S.meta,S.players,
    S.teams.map(t=>t.id)]);
  if(sig!==lastData){lastData=sig;render();}
}
async function ensureMeta(){
  const t=S.team;if(!t)return;
  const free=t==='emerald_ibises'?2:1;
  const {error}=await c.from('game_meta').upsert({team_id:t,free_hints_left:free},{onConflict:'team_id'});
  if(!error){const r=await c.from('game_meta').select('*').eq('team_id',t);S.meta=(r.data||[])[0]||null;}
}

/* ============ NAV ============ */
function go(tab){S.tab=tab;
  ['Play','Letters','Board','Host'].forEach(x=>{const b=$('tab'+x);if(b)b.classList.toggle('on',x.toLowerCase()===tab);});
  render();}
function render(){
  const t=team();
  $('teamPill').textContent=t?`${t.mascot} ${t.name}`:'🐱 Pick a guild';
  $('teamPill').style.background=t?t.color:'var(--accent)';
  $('scoreVal').textContent=S.team?myScore():'–';
  if(!S.team){renderGate();return;}
  if(S.tab==='play')renderPlay();
  else if(S.tab==='letters')renderLetters();
  else if(S.tab==='board')renderBoard();
  else renderHost();
}
function renderGate(){
  $('screen').innerHTML=`
  <div class="card center">
    <div style="font-size:44px">🐱🍦</div>
    <h1>The Golden Gelato Goblet</h1>
    <p class="tiny">Pick your guild to play. Everyone on the team can use the same guild on their own phones — progress syncs live.</p>
    <div class="teamgrid" id="tg"></div>
    <p class="tiny" style="margin-top:12px">Not on the roster yet? <a href="join.html" style="color:var(--teal-dark);font-weight:800">Join a Guild first →</a></p>
  </div>`;
  const g=$('tg');g.innerHTML='';
  S.teams.forEach(t=>{
    const n=S.players.filter(p=>p.team_id===t.id).length;
    const d=document.createElement('div');
    d.className='teamcard';d.style.borderColor=t.color;d.style.color=t.color;
    d.innerHTML=`<div class="ic">${t.mascot.split(' ')[0]}</div><div class="tn">${esc(t.name)}</div>
      <div class="tg">${esc(t.god)} · ${n} joined</div>`;
    d.onclick=()=>pickTeam(t.id);
    g.appendChild(d);
  });
}
async function pickTeam(id){
  S.team=id;localStorage.setItem('ght_team',id);
  await ensureMeta();await loadAll();go('play');
}
function changeTeam(){localStorage.removeItem('ght_team');S.team=null;S.meta=null;render();}

/* ============ WAIT / RELEASE ============ */
function renderWait(msLeft,started){
  const t=team();
  const mm=String(Math.floor(msLeft/60000)).padStart(2,'0');
  const ss=String(Math.floor((msLeft%60000)/1000)).padStart(2,'0');
  $('screen').innerHTML=`
  <div class="card center">
    <div style="font-size:40px">⏳</div>
    <h1>${started?'Your guild hasn\'t been released yet':'Waiting for the host to start the hunt'}</h1>
    ${started?`<p class="tiny">${esc(t.name)} is released at <b>T+${RELEASE[S.team]}:00</b> from Stop 1 (the Grand Fountain).</p>
      <div class="countdown">${mm}:${ss}</div>
      <p class="tiny">Stretch. Hydrate. Practice your chant.</p>`:
      `<p class="tiny">The host opens the <b>🔐 Host</b> tab and taps <b>▶️ Start the hunt</b> — then the release clock begins for all five guilds.</p>`}
    <button class="btn ghost small" onclick="changeTeam()">Not ${esc(t.name)}? Switch guild</button>
  </div>`;
}
function tickWait(){
  if(!S.team||S.tab!=='play')return;
  const st=S.settings.hunt_started_at;
  if(!st){renderWait(0,false);return;}
  const rel=releaseTime();const left=rel-Date.now();
  if(left>0)renderWait(left,true);
}

/* ============ PLAY ============ */
function renderPlay(){
  if(S.waitTimer){clearInterval(S.waitTimer);S.waitTimer=null;}
  if(!S._loaded){$('screen').innerHTML='<div class="card center"><div class="loading">Summoning the guilds…</div></div>';return;}
  if(!S.settings.hunt_started_at){renderWait(0,false);S.waitTimer=setInterval(tickWait,1000);return;}
  if(releaseTime()>Date.now()){tickWait();S.waitTimer=setInterval(tickWait,1000);return;}
  if(finished()){renderFinished();return;}
  if(S.reveal){renderReveal();return;}
  if(S.justDone){const j=S.justDone;renderDoneCard(STOPS[j-1],j);return;}
  let n=activeStop();
  if(n===0){renderFinale();return;}
  if(n>=13&&!gauntletDone()){renderGauntlet();return;}
  const st=STOPS[n-1];
  const pr=S.progress.find(p=>p.stop_number===n);
  if(pr&&pr.riddle_solved&&!pr.dare_done){renderDareAsync(st);return;}
  if(pr&&pr.riddle_solved&&pr.dare_done){renderDoneCard(st,n);return;}
  renderRiddle(st);
}
function progressNote(){
  const done=lettersCount();
  return `<div class="progressbar"><i style="width:${done/18*100}%"></i></div>
  <div class="progress-note">${done}/18 letters · ${S.teams.length} guilds hunting</div>`;
}
function renderRiddle(st){
  const pr=S.progress.find(p=>p.stop_number===st.n)||{};
  const hints=S.meta?S.meta.free_hints_left:1;
  $('screen').innerHTML=`
  <div class="card">
    <span class="act-badge ${st.tier===2?'a2':''}">${st.tier===2?'ACT II · GOBLET':'ACT I · GOLDEN GELATO'}</span>
    <div style="display:flex;align-items:center;gap:10px">
      <span class="stopnum">${st.n}</span>
      <b style="font-size:14px;color:#5a4a32">Solve the riddle → find the venue → do the dare</b>
    </div>
    ${progressNote()}
    <div class="riddle">${esc(st.riddle)}</div>
    <div id="ansBox">
      <input type="text" id="ansIn" placeholder="Type the venue name…" autocomplete="off" autocapitalize="none" />
      <button class="btn main" onclick="submitAnswer(${st.n})">Unlock the letter 🔓</button>
      <div class="row" style="margin-top:8px">
        <button class="btn ghost small" onclick="useHint(${st.n})">🐾 Whisker hint ${hints>0?'(free)':'(−2)'}</button>
      </div>
      ${S.hintMsg?`<div class="msg show info">${esc(S.hintMsg)}</div>`:''}
    </div>
    <div class="msg" id="playMsg"></div>
    <p class="tiny" style="margin-top:10px">💡 Say it out loud first — the riddle knows. Stuck? Ask a shop, a pigeon, or your fellow explorers. (No Googling! −3)</p>
  </div>`;
  const i=$('ansIn');if(i){i.addEventListener('keydown',e=>{if(e.key==='Enter')submitAnswer(st.n);});}
}
function pmsg(t,kind){const m=$('playMsg');if(!m)return;m.className='msg show '+(kind||'err');m.textContent=t;}
async function submitAnswer(n){
  const st=STOPS[n-1];const raw=$('ansIn').value;const na=norm(raw);
  if(!na){pmsg('Type an answer first — Cleocatra is watching.','err');return;}
  const ok=st.ans.some(a=>{const x=norm(a);return x&&((na.length>=4&&x.includes(na))||(x.length>=4&&na.includes(x)));});
  const pr=S.progress.find(p=>p.stop_number===n);
  if(!ok){
    S.wrongN++;
    const box=$('ansBox');box.classList.remove('wrong-shake');void box.offsetWidth;box.classList.add('wrong-shake');
    if(!pr){await c.from('stops_progress').upsert({team_id:S.team,stop_number:n,attempts:1},{onConflict:'team_id,stop_number'});}
    else{await c.from('stops_progress').update({attempts:(pr.attempts||0)+1}).eq('team_id',S.team).eq('stop_number',n);}
    pmsg(S.wrongN%3===2?'Cleocatra laughs. That\'s not it — try again! 🐾':'Not that one. Read the riddle again…','err');
    return;
  }
  // solved — ensure a progress row exists (first-try-correct path has none yet),
  // then claim it with the first-writer guard so points are awarded exactly once
  let lat=null,lng=null;
  try{const pos=await new Promise((res,rej)=>{if(!navigator.geolocation)return rej();
    navigator.geolocation.getCurrentPosition(p=>res(p),()=>rej(),{timeout:6000,maximumAge:30000});});
    lat=pos.coords.latitude;lng=pos.coords.longitude;}catch(e){}
  await c.from('stops_progress').upsert({team_id:S.team,stop_number:n},
    {onConflict:'team_id,stop_number',ignoreDuplicates:true});
  const up=c.from('stops_progress').update({riddle_solved:true,solved_at:new Date().toISOString(),lat,lng})
    .eq('team_id',S.team).eq('stop_number',n).eq('riddle_solved',false).select();
  const {data,error}=await up;
  if(error){pmsg('Network hiccup: '+error.message,'err');return;}
  if(!data||!data.length){await loadAll();pmsg('Already solved — on to the dare!','ok');S.playView='dare';render();return;}
  const pts=tierPts(st.tier);
  await c.from('score_events').insert({team_id:S.team,stop_number:n,points:pts,description:`Stop ${n} riddle solved`});
  S.reveal={letter:st.letter,n:n};
  await loadAll();
  renderReveal();
}
function renderReveal(){
  const r=S.reveal;
  const d=document.createElement('div');d.className='reveal';d.id='revealOv';
  d.innerHTML=`<div class="tiny" style="color:#cfe8e8;letter-spacing:3px">STOP ${r.n} CLEARED · +${tierPts(STOPS[r.n-1].tier)}</div>
    <div class="big">${r.letter}</div>
    <div class="rw">Letter ${r.n} of 18 secured!</div>
    <button class="btn gold" style="max-width:280px;margin-top:26px" onclick="closeReveal()">Now do the dare 📸</button>`;
  document.body.appendChild(d);
}
function closeReveal(){const d=$('revealOv');if(d)d.remove();S.reveal=null;S.playView='dare';
  const n=curStop();renderDareAsync(STOPS[n-1]);}
function renderDare(st){
  $('screen').innerHTML=`
  <div class="card">
    <span class="act-badge ${st.tier===2?'a2':''}">${st.tier===2?'ACT II · CAT TAX':'ACT I · DARE'}</span>
    <div style="display:flex;align-items:center;gap:10px"><span class="stopnum">${st.n}</span>
    <b style="font-size:14px;color:#5a4a32">${esc(st.loc)}</b></div>
    <div class="dare"><b>Dare:</b> ${esc(st.dare)}</div>
    <p class="bonus">${esc(st.bonus)}</p>
    ${S.photo?(S.mediaType==='video'
      ?`<video src="${S.photo}" controls playsinline preload="metadata" style="width:100%;border-radius:12px;border:3px solid var(--gold);margin-top:8px"></video>`
      :`<img src="${S.photo}" style="width:100%;border-radius:12px;border:3px solid var(--gold);margin-top:8px" />`):''}
    <div class="row" style="margin-top:8px">
      <button class="btn main" style="flex:1" onclick="$('camera').click()">📷 ${S.photo&&S.mediaType==='image'?'Retake photo':'Photo'}</button>
      <button class="btn ghost" style="flex:1" onclick="$('videoCam').click()">🎥 ${S.photo&&S.mediaType==='video'?'Retake video':'Video'}</button>
    </div>
    ${S.photo?`<button class="btn gold" onclick="acceptDare(${st.n})">✓ ${S.mediaType==='video'?'Video':'Photo'} looks glorious — claim the points</button>`:''}
    <div class="msg" id="playMsg"></div>
    <p class="tiny" style="margin-top:10px">🎥 Short videos welcome (10–30s is plenty) — a video counts as your photo proof. The roaming host may demand to see it later; keep it on your roll. 🐱</p>
  </div>`;
}
/* captured dare media survives reloads (IndexedDB) */
function idbOpen(){return new Promise((res,rej)=>{const q=indexedDB.open('ght_media',1);
  q.onupgradeneeded=()=>{q.result.createObjectStore('k');};q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}
async function saveMedia(stop,type,blob){try{const db=await idbOpen();
  db.transaction('k','readwrite').objectStore('k').put({type:type,blob:blob,ts:Date.now()},String(stop));}catch(e){}}
async function loadMedia(stop){try{const db=await idbOpen();
  return await new Promise(res=>{const r=db.transaction('k').objectStore('k').get(String(stop));
    r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null);});}catch(e){return null;}}
async function clearMedia(stop){try{const db=await idbOpen();
  db.transaction('k','readwrite').objectStore('k').delete(String(stop));}catch(e){}}
async function renderDareAsync(st){
  if(!S.photo){const m=await loadMedia(st.n);
    if(m&&!S.photo){S.photo=URL.createObjectURL(m.blob);S.mediaType=m.type;}}
  renderDare(st);
}
function onPhoto(ev){
  const f=ev.target.files&&ev.target.files[0];if(!f)return;
  S.photo=URL.createObjectURL(f);S.mediaType='image';ev.target.value='';
  saveMedia(curStop(),'image',f);
  const n=curStop();renderDare(STOPS[n-1]);
}
function onVideo(ev){
  const f=ev.target.files&&ev.target.files[0];if(!f)return;
  S.photo=URL.createObjectURL(f);S.mediaType='video';ev.target.value='';
  saveMedia(curStop(),'video',f);
  const n=curStop();renderDare(STOPS[n-1]);
}
async function acceptDare(n){
  const st=STOPS[n-1];
  const {data,error}=await c.from('stops_progress').update({dare_done:true,completed_at:new Date().toISOString()})
    .eq('team_id',S.team).eq('stop_number',n).eq('dare_done',false).eq('riddle_solved',true).select();
  if(error){pmsg('Save failed: '+error.message,'err');return;}
  if(data&&data.length){
    const pts=tierPts(st.tier);
    await c.from('score_events').insert({team_id:S.team,stop_number:n,points:pts,description:`Stop ${n} dare complete`});
    S.photo=null;S.mediaType=null;clearMedia(n);S.playView='riddle';S.hintMsg='';S.justDone=n;
    await loadAll();
    showMsg(`Letter ${st.letter} earned! +${pts} — next stop unlocked. 🐱`,'ok');
    go('play');
  }else{await loadAll();go('play');showMsg('Couldn\u0027t claim that — state refreshed, tap the claim button again.','err');}
}
function renderDoneCard(st,n){
  $('screen').innerHTML=`
  <div class="card center">
    <div class="stamp">✅</div>
    <h1>Stop ${n} complete</h1>
    <p><b>${esc(st.loc)}</b></p>
    <p class="tiny">Letter <b>${st.letter}</b> in the pouch · points banked</p>
    ${progressNote()}
    ${n<18?`<button class="btn main" onclick="S.justDone=null;S.playView='riddle';render()">Next stop → ${n+1} 🐾</button>`:
      `<button class="btn gold" onclick="S.justDone=null;render()">All stops done — go to the finale 🏁</button>`}
  </div>`;
}
async function useHint(n){
  const st=STOPS[n-1];const canon=norm(st.ans[0]).replace(/\s/g,'');
  const clue=`🐾 Clue: starts with "${canon[0].toUpperCase()}" · ${canon.length} letters`;
  if(S.meta&&S.meta.free_hints_left>0){
    await c.from('game_meta').update({free_hints_left:S.meta.free_hints_left-1,updated_at:new Date().toISOString()})
      .eq('team_id',S.team);
    S.hintMsg=clue+' (free Whisker used)';
  }else{
    await c.from('score_events').insert({team_id:S.team,stop_number:n,points:-2,description:`Hint at stop ${n}`});
    S.hintMsg=clue+' (−2 points — Cleocatra judges)';
  }
  await loadAll();render();
}

/* ============ GAUNTLET ============ */
function renderGauntlet(){
  if(S.gTimer){clearInterval(S.gTimer);S.gTimer=null;}
  const meta=S.meta||{};
  if(meta.gauntlet_done){renderGauntletPass(meta);return;}
  if(!meta.gauntlet_card){
    $('screen').innerHTML=`
    <div class="card center">
      <div style="font-size:44px">⚔️</div>
      <h1>The Nine Lives Gauntlet</h1>
      <p><b>Act I is done.</b> Report to the <b>Gauntlet Hub — the open courtyard by the cinema (Cima Arkan)</b>, then draw your challenge.</p>
      <p class="tiny">One card. Two minutes. +10 if you pass (+3 speed bonus if you finish under 2:00). Fail? Redraw once — 0 points, maximum dignity lost.</p>
      ${progressNote()}
      <button class="btn gold" onclick="drawCard()">🃏 Draw your card</button>
    </div>`;
    return;
  }
  const card=GCARDS[(meta.gauntlet_card||1)-1];
  $('screen').innerHTML=`
  <div class="card">
    <span class="act-badge">NINE LIVES GAUNTLET</span>
    <div class="gcard"><h3>${esc(card.title)}</h3><p>${esc(card.body)}</p></div>
    <div id="gArea"></div>
    <div class="msg" id="playMsg"></div>
  </div>`;
  if(card.type==='riddle')renderSphinx();
  else if(card.type==='quiz')renderQuiz();
  else renderPhysical();
}
async function drawCard(){
  const pick=1+Math.floor(Math.random()*6);
  localStorage.setItem('ght_gcard_'+S.team,String(pick));
  const {error}=await c.from('game_meta').update({gauntlet_card:pick,updated_at:new Date().toISOString()})
    .eq('team_id',S.team);
  if(error){pmsg('Could not draw: '+error.message,'err');return;}
  await loadAll();render();
}
function gStartTimer(){
  if(!S.gStart)S.gStart=Date.now();
  const tick=()=>{
    const el=Date.now()-S.gStart;const left=Math.max(0,120000-el);
    const mm=String(Math.floor(left/60000)),ss=String(Math.floor((left%60000)/1000)).padStart(2,'0');
    const t=$('gtimer');if(t){t.textContent=`${mm}:${ss}`;t.classList.toggle('low',left<30000);}
  };
  tick();S.gTimer=setInterval(tick,500);
  const b=$('ggo');if(b){b.disabled=true;b.textContent='⏱ Timer running — GO GO GO!';}
}
function renderPhysical(){
  $('gArea').innerHTML=`
    <div class="timer" id="gtimer">2:00</div>
    <button class="btn main" id="ggo" onclick="gStartTimer()">⏱ Start the 2:00 clock</button>
    <button class="btn gold" onclick="completeGauntlet()">✅ We did it! (host witnessed)</button>
    <p class="tiny">Do it at the hub. The host (or the most responsible bystander) must see it happen.</p>`;
}
function renderSphinx(){
  let idx=localStorage.getItem('ght_sphinx_'+S.team);
  if(idx==null){idx=String(Math.floor(Math.random()*SPHINX.length));localStorage.setItem('ght_sphinx_'+S.team,idx);}
  const r=SPHINX[+idx];
  $('gArea').innerHTML=`
    <div class="timer" id="gtimer">2:00</div>
    <p class="qlabel">THE SPHINX ASKS:</p><div class="qtext">${esc(r.q)}</div>
    <input type="text" id="sqIn" placeholder="Your answer…" autocapitalize="none" />
    <button class="btn main" id="ggo" onclick="gStartTimer()">⏱ Start the clock & answer</button>
    <button class="btn gold" onclick="answerSphinx()">Unlock the pass 🐾</button>`;
}
async function answerSphinx(){
  const idx=+localStorage.getItem('ght_sphinx_'+S.team||'0');const r=SPHINX[idx];
  const na=norm($('sqIn').value);
  const ok=r.a.some(a=>{const x=norm(a);return na===x||(x.includes(na)&&na.length>=3)||(na.includes(x)&&x.length>=3);});
  if(!ok){pmsg('The Sphinx hisses. Wrong! Hiss at your shadow 10 seconds and try again.','err');return;}
  completeGauntlet();
}
function renderQuiz(){
  if(!S.quiz.started){
    $('gArea').innerHTML=`<p class="qlabel">CANOPIC JAR QUIZ — 5 questions, need 4 ✅</p>
      <button class="btn main" onclick="S.quiz={started:true,i:0,correct:0};render()">Start the quiz ⏱</button>
      <p class="tiny">Timer starts on tap. Shouting answers in unison encouraged.</p>`;
    return;
  }
  if(S.quiz.i>=QUIZ.length){
    const pass=S.quiz.correct>=4;
    $('gArea').innerHTML=`
      <div class="center"><div style="font-size:44px">${pass?'🏺✅':'💀'}</div>
      <h1>${pass?'You passed!':'Not enough'}</h1>
      <p>${S.quiz.correct}/5 correct — ${pass?'the Canopic Jar accepts your offering.':'Need 4 of 5. Retry the quiz (the jar is patient… mostly).'}</p></div>
      ${pass?`<button class="btn gold" onclick="completeGauntlet()">Claim the gauntlet pass ✅</button>`:
        `<button class="btn ghost" onclick="S.quiz={started:false};render()">Retry quiz</button>`}`;
    return;
  }
  const q=QUIZ[S.quiz.i];
  $('gArea').innerHTML=`
    <div class="timer" id="gtimer">2:00</div>
    <p class="qlabel">QUESTION ${S.quiz.i+1}/5 · correct so far: ${S.quiz.correct}</p>
    <div class="qtext">${esc(q.q)}</div>
    <input type="text" id="quizIn" placeholder="Answer…" autocapitalize="none" />
    <button class="btn main" id="ggo" onclick="gStartTimer()">⏱ Start the clock</button>
    <button class="btn gold" onclick="answerQuiz()">Submit answer</button>`;
}
async function answerQuiz(){
  const q=QUIZ[S.quiz.i];const na=norm($('quizIn').value);
  const ok=q.a.some(a=>{const x=norm(a);return na===x||x===na||(x.includes(na)&&na.length>=2)||(na.includes(x)&&x.length>=2);});
  if(ok){S.quiz.correct++;}
  S.quiz.i++;render();
  if(ok)showMsg('✅ Correct!','ok');else showMsg('❌ Wrong — the jar judges you silently.','err');
}
async function completeGauntlet(){
  if(S.gTimer){clearInterval(S.gTimer);S.gTimer=null;}
  const ms=S.gStart?Date.now()-S.gStart:999999;
  const {data,error}=await c.from('game_meta').update({gauntlet_done:true,gauntlet_ms:ms,updated_at:new Date().toISOString()})
    .eq('team_id',S.team).eq('gauntlet_done',false).select();
  if(error){pmsg('Error: '+error.message,'err');return;}
  if(data&&data.length){
    await c.from('score_events').insert({team_id:S.team,stop_number:null,points:10,description:'Nine Lives Gauntlet passed'});
    if(ms<120000)await c.from('score_events').insert({team_id:S.team,stop_number:null,points:3,description:'Gauntlet speed bonus (<2:00)'});
    await loadAll();
    showMsg(`Gauntlet cleared! +10${ms<120000?' +3 speed':''} — Act II unlocks! 🗺️`,'ok');
  }
  localStorage.removeItem('ght_sphinx_'+S.team);
  S.quiz={};await loadAll();go('play');
}
function renderGauntletPass(meta){
  $('screen').innerHTML=`
  <div class="card center">
    <div class="stamp">🗺️</div>
    <h1>Act II unlocked</h1>
    <p>The Sphinx is impressed. Stops <b>13–18</b> are live — the letters spell <b>GOBLET</b>.</p>
    <p class="tiny">Gauntlet time: ${meta.gauntlet_ms!=null?Math.round(meta.gauntlet_ms/1000)+'s':'—'}${meta.gauntlet_ms<120000?' · ⚡ speed bonus!':''}</p>
    ${progressNote()}
    <button class="btn main" onclick="S.playView='riddle';go('play')">Hunt Act II → 🐾</button>
  </div>`;
}

/* ============ FINALE ============ */
function renderFinale(){
  const fin=S.finishes.find(f=>f.team_id===S.team);
  $('screen').innerHTML=`
  <div class="card">
    <span class="act-badge">🏁 FINALE · STOP 1</span>
    <h1>The final riddle</h1>
    <div class="riddle">You've spelled my three words from G to T — now run back where the fountain flow.
Golden… Gelato… Goblet.
Where does a golden gelato goblet live?
RUN TO STOP 1! 🐱🍦</div>
    <p class="tiny">You're at the Grand Fountain & Main Courtyard. Type the three words to claim your finish:</p>
    <input type="text" id="finIn" placeholder="The three words…" autocapitalize="none" />
    <button class="btn gold" onclick="claimFinish()">Claim the goblet 🏆</button>
    <div class="msg" id="playMsg"></div>
    ${fin?`<p class="tiny" style="margin-top:10px">Finished at place <b>#${fin.finish_order}</b>.</p>`:''}
  </div>`;
}
async function claimFinish(){
  const na=norm($('finIn').value);
  if(na!==FINAL_WORDS){pmsg('Cleocatra scoffs. That is not what the letters spell. (Look at your Letters tab 📋)','err');return;}
  const {data:upd,error:e1}=await c.from('game_meta').update({finished:true,updated_at:new Date().toISOString()})
    .eq('team_id',S.team).eq('finished',false).select();
  if(e1){pmsg('Error: '+e1.message,'err');return;}
  let fin=null;
  if(upd&&upd.length){
    const {data:ins,error:e2}=await c.from('finishes').insert({team_id:S.team}).select();
    if(e2){pmsg('Error: '+e2.message,'err');return;}
    fin=(ins&&ins[0])||null;
    if(!fin){const r=await c.from('finishes').select('*').eq('team_id',S.team);fin=(r.data||[])[0];}
    const rank=fin?fin.finish_order:99;
    if(rank<=3){
      await c.from('score_events').insert({team_id:S.team,stop_number:null,points:FINISH_PTS[rank],
        description:`Finish bonus — ${rank===1?'1st':rank===2?'2nd':'3rd'} place`});
    }
    await loadAll();
    showMsg(`🏁 FINISHED! Place #${rank}${rank<=3?` — +${FINISH_PTS[rank]} bonus!`:''} The goblet is (maybe) yours.`,`ok`);
  }else{await loadAll();}
  go('play');
}
function renderFinished(){
  const fin=S.finishes.find(f=>f.team_id===S.team);
  const rank=fin?fin.finish_order:'—';
  $('screen').innerHTML=`
  <div class="card center">
    <div style="font-size:56px">🏆</div>
    <h1>You finished!</h1>
    <p>Place <b>#${rank}</b> · final letter count <b>${lettersCount()}/18</b></p>
    <p class="tiny">Find the host for the frozen trophy bag, prizes, and the group photo. 🐱🍦</p>
    ${progressNote()}
    <button class="btn ghost small" onclick="changeTeam()">Switch guild</button>
  </div>`;
}

/* ============ LETTERS ============ */
function renderLetters(){
  const t=team();
  let boxes='';
  for(let n=1;n<=18;n++){
    const on=letterOn(n);
    boxes+=`<div class="lbox ${on?'on':''} ${(n===6||n===12)?'gap':''}"><span class="n">${n}</span>${on?LETTERS[n-1]:'?'}</div>`;
  }
  const done=lettersCount();
  $('screen').innerHTML=`
  <div class="card center">
    <h2>🔤 Your letters</h2>
    <div class="letters">${boxes}</div>
    ${done>=12?`<div class="words"><span class="gapw">GOLDEN</span><span class="gapw">GELATO</span>${done>=18?'<span class="gapw">GOBLET</span>':''}</div>`:
      `<p class="tiny">Collect all 18 to spell what Cleocatra stole…</p>`}
    ${done===18?`<p style="font-weight:800;color:var(--teal-dark);margin-top:10px">Now RUN to Stop 1 and type the three words! 🏃</p>`:''}
    ${progressNote()}
    <p class="tiny">Every letter = riddle solved + dare done. Points are already in your score.</p>
  </div>`;
}

/* ============ BOARD ============ */
function renderBoard(){
  const rows=S.teams.map(t=>{
    const letters=S.progress.filter(p=>p.team_id===t.id&&p.dare_done).length;
    const fin=S.finishes.find(f=>f.team_id===t.id);
    return {t,pts:totalFor(t.id),letters,fin};
  }).sort((a,b)=>(b.fin?1:0)-(a.fin?1:0)||b.pts-a.pts);
  $('screen').innerHTML=`
  <div class="card">
    <h2>🏆 Live leaderboard</h2>
    ${rows.map((r,i)=>`<div class="lbrow ${r.t.id===S.team?'me':''}">
      <span class="rk">${i+1}</span>
      <span class="nm">${r.t.mascot.split(' ')[0]} ${esc(r.t.name)}
        <small>${r.letters}/18 letters${r.fin?` · 🏁 #${r.fin.finish_order}`:''}</small></span>
      <span class="pts">${r.pts}</span></div>`).join('')}
    <p class="tiny" style="margin-top:10px">Updates live. Twist & quest points from the host land here too.</p>
    <a class="btn ghost small" href="scoreboard.html">Open the big scoreboard →</a>
  </div>`;
}

/* ============ HOST ============ */
function renderHost(){
  if(!S.hostMode){
    $('screen').innerHTML=`
    <div class="card hostbox">
      <h2>🔐 Host controls</h2>
      <details open><summary>Enter the host PIN</summary>
        <div style="margin-top:10px">
          <input type="password" id="pinIn" placeholder="Host PIN" autocomplete="off" />
          <button class="btn main" onclick="hostLogin()">Unlock</button>
        </div>
      </details>
      <p class="tiny">Players should use the Play tab. This panel starts the hunt, awards twist points, and resets the game.</p>
    </div>`;
    return;
  }
  const started=S.settings.hunt_started_at;
  $('screen').innerHTML=`
  <div class="card hostbox">
    <h2>🎛️ Host panel</h2>
    <p class="tiny">Hunt clock: <b>${started?new Date(started).toLocaleTimeString():'not started'}</b></p>
    <button class="btn main" onclick="startHunt()">${started?'⏱ Restart the release clock':'▶️ Start the hunt'}</button>
    <p class="tiny">Sets T=now. Blue +0 · Red +5 · Green +10 · Gold +15 · Purple +20 minutes.</p>
    <hr style="border:none;border-top:1px dashed var(--gold);margin:14px 0" />
    <h2>⚡ Quick points (twists ★ quests curses)</h2>
    <select id="qaTeam" style="width:100%;padding:12px;border-radius:9px;border:1px solid #d8cba9;font-size:15px">
      ${S.teams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}
    </select>
    <div class="row" style="margin-top:8px">
      <input type="text" id="qaPts" placeholder="±points" inputmode="numeric" style="flex:1" />
      <input type="text" id="qaWhy" placeholder="why…" style="flex:2" />
    </div>
    <button class="btn gold" onclick="quickAward()">Award points</button>
    <hr style="border:none;border-top:1px dashed var(--gold);margin:14px 0" />
    <button class="btn danger" onclick="resetAll()">🧹 Reset the whole game</button>
    <p class="tiny">Clears scores, letters, gauntlet & finishes — and stops the clock. Keeps the roster of players.</p>
    <button class="btn ghost small" onclick="S.hostMode=false;render()">Lock panel</button>
  </div>`;
}
async function sha256hex(text){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function hostLogin(){
  const pin=$('pinIn').value;if(!pin)return alert('Enter the PIN');
  const hex=await sha256hex(pin);
  if(hex===S.settings.host_pin_sha256){S.hostMode=true;render();}
  else{alert('Wrong PIN.');$('pinIn').value='';}
}
async function startHunt(){
  if(S.settings.hunt_started_at&&!confirm('Restart the release clock? All guild release times reset to now.'))return;
  const {error}=await c.from('settings').upsert({key:'hunt_started_at',value:new Date().toISOString()},{onConflict:'key'});
  if(error)return alert('Failed: '+error.message);
  await loadAll();showMsg('Hunt started! Blue is released — the rest follow on the clock.','ok');go('play');
}
async function quickAward(){
  const tid=$('qaTeam').value;const pts=parseInt($('qaPts').value,10);const why=$('qaWhy').value.trim()||'Host award';
  if(isNaN(pts)||pts===0)return alert('Enter points (e.g. 3 or -2)');
  const {error}=await c.from('score_events').insert({team_id:tid,stop_number:null,points:pts,description:why});
  if(error)return alert('Failed: '+error.message);
  $('qaPts').value='';$('qaWhy').value='';
  await loadAll();showMsg(`Awarded ${pts} to ${S.teams.find(t=>t.id===tid).name}.`,'ok');
}
async function resetAll(){
  const v=prompt('Type RESET to wipe all scores, letters, gauntlet progress and finishes:');
  if(v!=='RESET')return;
  const results=await Promise.all([
    c.from('score_events').delete().neq('id','00000000-0000-0000-0000-000000000000'),
    c.from('stops_progress').delete().neq('stop_number',-1),
    c.from('finishes').delete().neq('finish_order',-1),
    c.from('game_meta').delete().neq('team_id','__none__'),
    c.from('settings').upsert({key:'hunt_started_at',value:''},{onConflict:'key'})
  ]);
  const err=results.find(r=>r.error);
  if(err)return alert('Reset failed: '+err.error.message);
  S.quiz={};S.playView='riddle';
  await loadAll();showMsg('Game reset. Fresh hunt — start the clock when ready.','ok');go('host');
}

/* ============ BOOT ============ */
try{
  c.channel('game')
    .on('postgres_changes',{event:'*',schema:'public',table:'score_events'},()=>loadAll())
    .on('postgres_changes',{event:'*',schema:'public',table:'stops_progress'},()=>loadAll())
    .on('postgres_changes',{event:'*',schema:'public',table:'game_meta'},()=>loadAll())
    .on('postgres_changes',{event:'*',schema:'public',table:'finishes'},()=>loadAll())
    .on('postgres_changes',{event:'*',schema:'public',table:'settings'},()=>loadAll())
    .subscribe();
}catch(e){console.warn('realtime off',e);}
loadAll();
setInterval(()=>{if(S.team)loadAll();},6000);
</script>
