<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Arkan Plaza Treasure Hunt</title>
<style>
  :root{--gold:#d4a017;--gold-light:#f3d27a;--teal:#0f8a8a;--teal-dark:#0a5f5f;--sand:#f6efe1;--paper:#fffdf7;--ink:#2b2118;}
  *{box-sizing:border-box}
  body{font-family:"Segoe UI",Tahoma,Verdana,sans-serif;color:var(--ink);margin:0;background:var(--sand);}
  .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .card{background:var(--paper);border-radius:20px;padding:36px 30px;max-width:560px;text-align:center;
    box-shadow:0 14px 40px rgba(0,0,0,.15);border:1px solid #e7ddc7;}
  h1{color:var(--teal-dark);margin:.1em 0;font-size:28px;}
  .sub{opacity:.85;margin-bottom:24px;}
  .btn{display:block;width:100%;margin:12px 0;padding:16px;border-radius:12px;text-decoration:none;
    font-weight:800;font-size:17px;transition:transform .08s ease, box-shadow .15s ease;}
  .btn.score{background:var(--teal);color:#fff;}
  .btn.plan{background:var(--gold);color:#3a2c00;}
  .btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(0,0,0,.18);}
  .badge{display:inline-block;background:var(--gold);color:#3a2c00;font-weight:700;padding:5px 14px;border-radius:999px;font-size:13px;margin-top:6px;}
  .foot{font-size:12px;color:#6b5b42;margin-top:22px;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div style="font-size:40px">𓂀🍦</div>
      <h1>The Quest for the Golden Gelato Goblet</h1>
      <div class="sub">A treasure hunt through Arkan Plaza, Sheikh Zayed — for 5 teams.</div>
      <a class="btn score" href="scoreboard.html">🏆 Open Live Scoreboard</a>
      <a class="btn plan" href="arkan-treasure-hunt.html">📜 Open Treasure Hunt Plan</a>
      <div class="badge">⏱ ~2.5–3 hours • 👥 5 teams • 🐱 Cleocatra's quest</div>
      <div class="foot">Built on Supabase + Vercel · updates instantly for everyone.</div>
    </div>
  </div>
</body>
</html>
